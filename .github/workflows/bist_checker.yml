name: BIST & KAP Saatlik Tarama Botu

on:
  schedule:
    # Borsa İstanbul çalışma saatleri için (TSİ 09:00 - 18:00 arası her saat başı)
    # UTC Saatleri: 06:00, 07:00, 08:00, 09:00, 10:00, 11:00, 12:00, 13:00, 14:00, 15:00
    - cron: '0 6-15 * * 1-5'
  
  # İstediğiniz zaman manuel de tetikleyebilirsiniz
  workflow_dispatch:

jobs:
  build:
    runs-run-on: ubuntu-latest

    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas

      - name: Botu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
