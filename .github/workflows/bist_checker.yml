name: BIST Daily Checker

on:
  schedule:
    # Hafta içi her gün TSİ 10:00 - 18:00 arası saat başı çalışır (07:00 - 15:00 UTC)
    - cron: '0 7-15 * * 1-5'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests beautifulsoup4 pandas

      - name: Kodu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
